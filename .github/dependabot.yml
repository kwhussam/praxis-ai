version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      # Expo pins react/react-native/expo-* to one SDK. Shipping them as a single
      # PR keeps that set consistent instead of producing individually broken bumps.
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react-native"
          - "react-native-*"
          - "react"
          - "react-dom"
        update-types: [minor, patch]
    ignore:
      # No unattended major jumps. Expo SDK majors (e.g. expo-notifications
      # 0.28 -> 57) must move with the whole SDK in a tested upgrade, and crypto
      # majors such as @noble/ciphers 1 -> 2 need a manual review of the local
      # inventory encryption before they may land.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    labels: [dependencies, security]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Berlin
    labels: [dependencies, security]
