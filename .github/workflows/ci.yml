name: CI

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans the complete pushed commit range. A shallow checkout
          # cannot resolve github.event.before when several commits are pushed.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Install pinned Android NDK
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;25.1.8937393"
      - name: Install dependencies
        run: npm ci
      - name: Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate and verify native release configuration
        run: npx expo prebuild --no-install && npm run verify:native-config
        env:
          EXPO_PUBLIC_APP_ENV: production
      - name: Compile unsigned Android release and verify merged manifest
        run: ./android/gradlew -p android :app:assembleRelease && npm run verify:android-release-manifest
        env:
          EXPO_PUBLIC_APP_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-public-anon-placeholder
          EXPO_PUBLIC_API_BASE_URL: https://api.ci-placeholder.invalid
      - name: Verify
        run: npm run verify
        env:
          # Remote-environment Jest probes run when all TEST_* secrets exist.
          # Tenant/RPC enforcement is always covered by the mandatory local
          # rls-pgtap job below, so absent remote secrets are an explicit skip.
          ALLOW_MISSING_REMOTE_RLS_CONFIG: "true"
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_PRACTICE_A_EMAIL: ${{ secrets.TEST_PRACTICE_A_EMAIL }}
          TEST_PRACTICE_A_PASSWORD: ${{ secrets.TEST_PRACTICE_A_PASSWORD }}
          TEST_PRACTICE_B_ID: ${{ secrets.TEST_PRACTICE_B_ID }}

  rls-pgtap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start local Supabase
        run: supabase start
      - name: Run cross-tenant RLS pgTAP tests
        run: supabase db test --local
