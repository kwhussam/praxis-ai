name: Secure SDLC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  supply-chain:
    name: Dependency and SBOM Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install exactly locked dependencies
        run: npm ci
      - name: Block high and critical dependency vulnerabilities
        run: npm run security:dependencies
      - name: Generate and validate CycloneDX SBOM
        run: npm run security:sbom && npm run security:sbom:verify
      - name: Upload immutable SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyclonedx-sbom-${{ github.sha }}
          path: build/security/praxisshield.cdx.json
          if-no-files-found: error
          retention-days: 90

  dependency-review:
    name: Dependency Review Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Block newly introduced high and critical dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development

  codeql:
    name: CodeQL SAST Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze and publish SAST evidence
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: /language:javascript-typescript
          output: build/security/codeql-raw
          post-processed-sarif-path: build/security/codeql-sarif
      - name: Block high and critical SAST findings
        run: npm run security:sarif:gate -- build/security/codeql-sarif
