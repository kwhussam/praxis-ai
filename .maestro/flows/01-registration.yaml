appId: ai.praxisshield.app
name: 01-registration
tags:
  - ui-e2e
---
- runFlow: ../subflows/bootstrap.yaml
- evalScript: ${output.registrationEmail = "registration-" + Date.now() + "@example.test"}
- tapOn:
    id: auth-switch-mode
- tapOn:
    id: auth-email
- inputText: "${output.registrationEmail}"
# The email return action focuses the password input explicitly. This avoids an
# iOS 26 accessibility-coordinate issue that left the email field focused.
- pressKey: Enter
- inputText: "${TEST_PASSWORD}"
- pressKey: Enter
# A clean iOS 26 keychain asks to save the newly created password and covers the
# onboarding accessibility tree until the system sheet is dismissed.
- tapOn:
    text: "Später|Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: onboarding-screen
    timeout: 30000
- assertVisible: "Zugang wird freigeschaltet"
- assertNotVisible:
    id: auth-error
