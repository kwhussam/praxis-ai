appId: ai.praxisshield.app
name: 04-onboarding
tags:
  - ui-e2e
---
- runFlow: ../subflows/bootstrap.yaml
- runScript: ../scripts/create-onboarding-user.js
- assertTrue:
    condition: ${output.onboardingUser.status === 200 && output.onboardingUser.hasSession === true}
    label: Confirmed practice-less onboarding user is created
- runFlow:
    file: ../subflows/login-to-onboarding.yaml
    env:
      EMAIL: "${output.onboardingUser.email}"
      PASSWORD: "${output.onboardingUser.password}"
# Redeem-only (B4c/E-039): Ein praxisloser Nutzer darf KEINE Praxis selbst
# anlegen. Statt eines Domain-Formulars erscheint der Freischalt-Hinweis mit
# Redeem-CTA; das Dashboard bleibt bis zur Code-Einlösung unerreichbar.
- extendedWaitUntil:
    visible:
      id: onboarding-screen
    timeout: 30000
- assertVisible: "Zugang wird freigeschaltet"
- assertVisible:
    id: onboarding-redeem
- assertNotVisible:
    id: tab-dashboard
