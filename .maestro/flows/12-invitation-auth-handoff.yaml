appId: ai.praxisshield.app
name: 12-invitation-auth-handoff
---
- runFlow: ../subflows/bootstrap.yaml
- tapOn:
    id: auth-open-invitation
- extendedWaitUntil:
    visible:
      id: invitation-code
    timeout: 30000
- tapOn:
    id: invitation-code
- inputText: "ABCDEFGHJK"
# F-02: iOS 26 bietet dem XCTest-Treiber für diese Tastatur keine standardisierte
# Dismiss-Aktion mehr an. Ein Tap auf den nicht interaktiven Beschreibungstext
# schließt sie und committet zugleich den onChangeText-State des 10-stelligen Codes.
- tapOn:
    point: "50%,35%"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: invitation-submit
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Bitte zuerst einloggen und den Code danach einlösen."
    timeout: 30000
- tapOn: "Zum Login"
- extendedWaitUntil:
    visible: "Einladung abschließen"
    timeout: 30000
- assertVisible:
    id: auth-email
