appId: ai.praxisshield.app
name: 12-invitation-auth-handoff
---
- runFlow: ../subflows/bootstrap.yaml
- tapOn:
    id: auth-open-invitation
- extendedWaitUntil:
    visible:
      id: invitation-code
    timeout: 30000
- tapOn:
    id: invitation-code
- inputText: "ABCDEFGHJK"
# F-02: Tastatur schließen und Animation abwarten, damit der onChangeText-State
# (10-stelliger Code) committet ist, bevor getappt wird. Sonst ist canSubmit beim
# Tap noch false und redeem() bricht am frühen Guard ab, ohne die 401-Meldung zu
# zeigen. retryTapIfNoChange fängt einen verbliebenen Race ab.
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: invitation-submit
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Bitte zuerst einloggen und den Code danach einlösen."
    timeout: 30000
- tapOn: "Zum Login"
- extendedWaitUntil:
    visible: "Einladung abschließen"
    timeout: 30000
- assertVisible:
    id: auth-email
