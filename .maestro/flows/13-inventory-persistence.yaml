appId: ai.praxisshield.app
name: 13-inventory-persistence
tags:
  - ui-e2e
  - native-storage
---
- runFlow: ../subflows/bootstrap.yaml
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: owner-a@example.test
      PASSWORD: "${TEST_PASSWORD}"
- tapOn:
    id: tab-inventory
- extendedWaitUntil:
    visible:
      id: inventory-persistence-ready
    timeout: 30000
- scrollUntilVisible:
    element:
      id: inventory-add-item
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 50
- tapOn:
    id: inventory-name-input
    # Keep the already-positioned form out of Maestro's post-tap settle phase.
    # Otherwise the keyboard-driven FlatList relayout can outlive the native
    # first-responder window on iOS 26 and sends the following text nowhere.
    waitToSettleTimeoutMs: 0
- inputText: E2EPersistenzA
- tapOn: "Neuer Eintrag"
- tapOn:
    id: inventory-add-item
- scrollUntilVisible:
    element:
      id: inventory-persistence-ready
    direction: UP
    timeout: 30000
    visibilityPercentage: 50
- assertVisible: "Geräte 1"

# Ein Prozessneustart darf weder den verschluesselten SQLite-Snapshot noch
# den Keychain-/Keystore-Schluessel verlieren.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: tab-inventory
    timeout: 120000
- tapOn:
    id: tab-inventory
- extendedWaitUntil:
    visible:
      id: inventory-persistence-ready
    timeout: 30000
- assertVisible: "Geräte 1"

# Logout leert nur den Arbeitsspeicher. Nach erneuter Anmeldung muss dieselbe
# Praxis ihren lokalen Snapshot wieder entschluesseln koennen.
- runFlow: ../subflows/open-settings.yaml
- tapOn:
    id: settings-sign-out
- extendedWaitUntil:
    visible:
      id: auth-email
    timeout: 30000
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: owner-a@example.test
      PASSWORD: "${TEST_PASSWORD}"
- tapOn:
    id: tab-inventory
- extendedWaitUntil:
    visible:
      id: inventory-persistence-ready
    timeout: 30000
- assertVisible: "Geräte 1"

# Praxis B darf den Snapshot von Praxis A nicht sehen und erhaelt einen
# separaten praxisgebundenen Schluessel/Snapshot.
- runFlow: ../subflows/open-settings.yaml
- tapOn:
    id: settings-sign-out
- extendedWaitUntil:
    visible:
      id: auth-email
    timeout: 30000
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: owner-b@example.test
      PASSWORD: "${TEST_PASSWORD}"
- tapOn:
    id: tab-inventory
- extendedWaitUntil:
    visible:
      id: inventory-persistence-ready
    timeout: 30000
- assertVisible: "Geräte 0"
- scrollUntilVisible:
    element:
      id: inventory-add-item
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 50
- tapOn:
    id: inventory-name-input
    waitToSettleTimeoutMs: 0
- inputText: E2EPersistenzB
- tapOn: "Neuer Eintrag"
- tapOn:
    id: inventory-add-item
- scrollUntilVisible:
    element:
      id: inventory-persistence-ready
    direction: UP
    timeout: 30000
    visibilityPercentage: 50
- assertVisible: "Geräte 1"

# Rueckkehr zu Praxis A beweist Isolation und Wiederverwendbarkeit beider
# SecureStore-Schluessel ueber mehrere Sessionwechsel hinweg.
- runFlow: ../subflows/open-settings.yaml
- tapOn:
    id: settings-sign-out
- extendedWaitUntil:
    visible:
      id: auth-email
    timeout: 30000
- runFlow:
    file: ../subflows/login.yaml
    env:
      EMAIL: owner-a@example.test
      PASSWORD: "${TEST_PASSWORD}"
- tapOn:
    id: tab-inventory
- extendedWaitUntil:
    visible:
      id: inventory-persistence-ready
    timeout: 30000
- assertVisible: "Geräte 1"
