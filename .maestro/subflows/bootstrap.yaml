appId: ai.praxisshield.app
---
- launchApp:
    clearState: true
    clearKeychain: true
    permissions:
      all: allow
- retry:
    maxRetries: 3
    commands:
      - openLink:
          link: "${DEV_CLIENT_URL}"
- waitForAnimationToEnd:
    timeout: 420000
- tapOn:
    text: "Open|Öffnen"
    optional: true
- tapOn:
    text: Continue
    optional: true
- runFlow:
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn:
          point: "50%,34%"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - tapOn:
          point: "94%,7%"
- waitForAnimationToEnd:
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 30000
- runFlow:
    when:
      notVisible:
        id: auth-screen
    commands:
      - retry:
          maxRetries: 3
          commands:
            - openLink:
                link: "${DEV_CLIENT_URL}"
      - waitForAnimationToEnd:
          timeout: 420000
      - tapOn:
          text: "Open|Öffnen"
          optional: true
      - tapOn:
          text: Continue
          optional: true
      - runFlow:
          when:
            visible: "This is the developer menu.*"
          commands:
            - tapOn:
                point: "50%,34%"
      - runFlow:
          when:
            visible: "Reload"
          commands:
            - tapOn:
                point: "94%,7%"
      - waitForAnimationToEnd:
          timeout: 30000
      - waitForAnimationToEnd:
          timeout: 30000
# Expo Router 5 preserves the current deep-link route across a development-
# client reload. Reset every flow to the app root so a preceding reset-password
# or invitation flow cannot leak its route into the next serial smoke.
- retry:
    maxRetries: 3
    commands:
      - openLink:
          link: "praxisshield:///"
- waitForAnimationToEnd:
    timeout: 30000
# iOS 26 asks for confirmation again when the test switches from the dev-client
# URL to the app's root scheme. Without this second acknowledgement the auth
# screen is visible behind a system sheet, but Maestro cannot interact with it.
- tapOn:
    text: "Open|Öffnen"
    optional: true
- tapOn:
    text: Continue
    optional: true
- repeat:
    times: 6
    commands:
      - runFlow:
          when:
            notVisible:
              id: auth-email
          commands:
            - swipe:
                start: "50%,75%"
                end: "50%,25%"
                duration: 350
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn:
          text: Continue
      - waitForAnimationToEnd:
          timeout: 30000
- runFlow:
    when:
      visible: Reload
    commands:
      - tapOn:
          point: "94%,7%"
      - waitForAnimationToEnd:
          timeout: 30000
- extendedWaitUntil:
    visible:
      id: auth-email
    timeout: 30000
