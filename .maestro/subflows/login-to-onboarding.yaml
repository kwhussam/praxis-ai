appId: ai.praxisshield.app
---
- tapOn:
    id: auth-email
- inputText: "${EMAIL}"
- tapOn:
    id: auth-password
- inputText: "${PASSWORD}"
- pressKey: Enter
- runFlow:
    when:
      visible:
        id: auth-submit
    commands:
      - tapOn:
          id: auth-submit
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Später|Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: onboarding-screen
    timeout: 30000
