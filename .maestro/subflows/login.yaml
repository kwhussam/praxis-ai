appId: ai.praxisshield.app
---
- tapOn:
    id: auth-email
- inputText: "${EMAIL}"
- repeat:
    times: 5
    commands:
      - runFlow:
          when:
            notVisible:
              id: auth-password
          commands:
            - swipe:
                start: "50%,75%"
                end: "50%,25%"
                duration: 350
- tapOn:
    id: auth-password
- inputText: "${PASSWORD}"
- pressKey: Enter
- runFlow:
    when:
      visible:
        id: auth-submit
    commands:
      - tapOn:
          id: auth-submit
- waitForAnimationToEnd:
    timeout: 5000
# A clean iOS 26 keychain presents the system password-save prompt after every
# clearKeychain login. Dismiss it before asserting or using the dashboard.
- tapOn:
    text: "Später|Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: tab-dashboard
    timeout: 30000
