appId: ai.praxisshield.app
---
- tapOn:
    id: tab-check
- extendedWaitUntil:
    visible:
      id: check-start
    timeout: 15000
- scrollUntilVisible:
    element:
      id: check-start
    direction: DOWN
    speed: 60
    timeout: 30000
    visibilityPercentage: 80
    centerElement: true
- tapOn:
    id: check-start
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: questionnaire-answer-mfa-yes
    timeout: 15000
