appId: ai.praxisshield.app
---
- scrollUntilVisible:
    element:
      id: wlan-consent
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
- scrollUntilVisible:
    element:
      id: wlan-consent
    direction: DOWN
    speed: 40
    timeout: 15000
    visibilityPercentage: 20
    centerElement: true
- tapOn:
    id: wlan-consent
- tapOn:
    id: wlan-consent-continue
- scrollUntilVisible:
    element:
      id: wlan-start
    direction: DOWN
    speed: 60
    timeout: 15000
    visibilityPercentage: 50
